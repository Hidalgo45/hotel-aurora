{# Comprobante que se envia por correo.

   Los estilos van en el atributo style de cada etiqueta, no en una hoja
   aparte: la mayoria de clientes de correo descarta las reglas <style> y
   no soporta flexbox ni grid, por eso el diseno usa tablas. #}
<div style="margin:0;padding:24px 12px;background:#f5f6f3;
            font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#141f24;">

  <table role="presentation" cellpadding="0" cellspacing="0" border="0"
         width="100%" style="max-width:620px;margin:0 auto;background:#ffffff;
                border:1px solid #d8ddd5;border-radius:8px;overflow:hidden;">

    {# ---------- Cabecera ---------- #}
    <tr>
      <td style="background:#0e4c55;padding:24px 28px;">
        <p style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
          {{ hotel.nombre }}
        </p>
        <p style="margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.85);">
          Comprobante de reserva
        </p>
      </td>
    </tr>

    {# ---------- Saludo y codigo ---------- #}
    <tr>
      <td style="padding:28px 28px 0;">
        <p style="margin:0 0 14px;font-size:16px;">
          Hola {{ r.cliente.split(' ')[0] }}, tu reserva quedo registrada.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
               width="100%" style="background:#f2e7d0;border-radius:6px;
                      border-left:4px solid #8e6115;margin-bottom:22px;">
          <tr>
            <td style="padding:14px 16px;">
              <p style="margin:0;font-size:12px;letter-spacing:.1em;
                        text-transform:uppercase;color:#6b7a80;">
                Codigo de reserva
              </p>
              <p style="margin:4px 0 0;font-size:22px;font-weight:700;
                        color:#8e6115;letter-spacing:.03em;">
                {{ r.codigo }}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    {# ---------- Datos de la estadia ---------- #}
    <tr>
      <td style="padding:0 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
               width="100%" style="font-size:14px;border-collapse:collapse;">
          <tr>
            <td style="padding:7px 0;color:#52646a;width:45%;">Huesped</td>
            <td style="padding:7px 0;text-align:right;font-weight:600;">
              {{ r.cliente }}</td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Documento</td>
            <td style="padding:7px 0;text-align:right;">{{ r.cedula }}</td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Entrada</td>
            <td style="padding:7px 0;text-align:right;font-weight:600;">
              {{ r.fecha_checkin | fecha }} · desde las 14:00</td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Salida</td>
            <td style="padding:7px 0;text-align:right;font-weight:600;">
              {{ r.fecha_checkout | fecha }} · hasta las 12:00</td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Noches</td>
            <td style="padding:7px 0;text-align:right;">{{ r.noches }}</td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Huespedes</td>
            <td style="padding:7px 0;text-align:right;">
              {{ r.num_adultos }} {{ 'adulto' if r.num_adultos == 1 else 'adultos' }}
              {%- if r.num_ninos %}, {{ r.num_ninos }}
                {{ 'nino' if r.num_ninos == 1 else 'ninos' }}{% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:7px 0;color:#52646a;">Estado</td>
            <td style="padding:7px 0;text-align:right;font-weight:600;">
              {{ r.estado | replace('_', ' ') | title }}</td>
          </tr>
        </table>
      </td>
    </tr>

    {# ---------- Detalle economico ---------- #}
    <tr>
      <td style="padding:22px 28px 0;">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:.1em;
                  text-transform:uppercase;color:#6b7a80;">Detalle</p>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
               width="100%" style="font-size:14px;border-collapse:collapse;">
          {% for h in habitaciones %}
          <tr>
            <td style="padding:9px 0;border-top:1px solid #e7eae4;">
              {{ h.tipo }} · habitacion {{ h.numero }}
              <span style="color:#52646a;">(piso {{ h.piso }})</span>
            </td>
            <td style="padding:9px 0;border-top:1px solid #e7eae4;
                       text-align:right;white-space:nowrap;">
              {{ h.subtotal | dinero }}</td>
          </tr>
          {% endfor %}

          {% for s in servicios %}
          <tr>
            <td style="padding:9px 0;border-top:1px solid #e7eae4;">
              {{ s.nombre }}
              <span style="color:#52646a;">x{{ s.cantidad }}</span>
            </td>
            <td style="padding:9px 0;border-top:1px solid #e7eae4;
                       text-align:right;white-space:nowrap;">
              {{ s.subtotal | dinero }}</td>
          </tr>
          {% endfor %}

          <tr>
            <td style="padding:12px 0;border-top:2px solid #141f24;
                       font-weight:700;font-size:16px;">Total</td>
            <td style="padding:12px 0;border-top:2px solid #141f24;
                       text-align:right;font-weight:700;font-size:16px;
                       color:#8e6115;white-space:nowrap;">
              {{ total | dinero }}</td>
          </tr>
          {% if saldo and saldo > 0 %}
          <tr>
            <td style="padding:6px 0;color:#52646a;">Saldo pendiente</td>
            <td style="padding:6px 0;text-align:right;color:#8a5410;
                       font-weight:600;">{{ saldo | dinero }}</td>
          </tr>
          {% endif %}
        </table>
      </td>
    </tr>

    {# ---------- Politica de cancelacion ---------- #}
    <tr>
      <td style="padding:22px 28px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
               width="100%" style="background:#f5f6f3;border-radius:6px;">
          <tr>
            <td style="padding:14px 16px;font-size:13px;color:#52646a;">
              <strong style="color:#141f24;">Cancelacion.</strong>
              Sin cargo hasta 48 horas antes de la llegada. Despues de ese
              plazo se aplica un cargo del 20 % del total. Puedes cancelar
              desde tu reserva indicando el codigo {{ r.codigo }}.
            </td>
          </tr>
        </table>
      </td>
    </tr>

    {# ---------- Pie ---------- #}
    <tr>
      <td style="padding:22px 28px 28px;">
        <p style="margin:0;font-size:13px;color:#52646a;line-height:1.6;">
          {{ hotel.nombre }} · {{ hotel.ciudad }}<br>
          Recepcion 24 horas: {{ hotel.telefono }}
        </p>
        <p style="margin:14px 0 0;font-size:12px;color:#8b9b9d;">
          Este comprobante se genero automaticamente al registrar la reserva.
          Conserva el codigo: lo necesitaras al llegar.
        </p>
      </td>
    </tr>
  </table>
</div>
